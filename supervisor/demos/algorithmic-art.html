<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>demo — flow field</title>
<style>:root{--bg:#0c0e12;--tx:#e6e9ef;--mut:#8b94a5;--line:#232936;--mono:ui-monospace,Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif}main{max-width:900px;margin:0 auto;padding:28px 20px 60px}h1{font-size:30px;letter-spacing:-.02em;margin:0}p{color:var(--mut);font-size:14px}a.back{font-family:var(--mono);font-size:12px;color:var(--mut)}canvas{width:100%;border:1px solid var(--line);border-radius:18px;display:block;background:#08090c}.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0;font-family:var(--mono);font-size:12px}button,input[type=range]{accent-color:#4cc38a}button{background:#171b23;color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-family:var(--mono);font-size:12px;cursor:pointer}button:hover{border-color:var(--mut)}.val{color:var(--mut);min-width:90px}</style>
</head>
<body>
<main>
<a class="back" href="index.html">← demos</a>
<h1>Flow field</h1>
<p>skill: algorithmic-art · seeded curl-noise particles. Same seed always draws the same sky.</p>
<canvas id="c" width="880" height="520"></canvas>
<div class="bar"><button id="prev">← seed</button><button id="next">seed →</button><button id="rand">random</button><span class="val" id="sv"></span></div>
<div class="bar"><label>particles <input type="range" id="n" min="200" max="3000" step="100" value="1200"></label><label>trail <input type="range" id="tr" min="2" max="40" value="12"></label><button id="re">regenerate</button></div>
</main>
<script>
const cv=document.querySelector("#c"),cx=cv.getContext("2d");
let seed=42,N=1200,TRAIL=12,ps=[];
function srand(s){return()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function noise(x,y){return Math.sin(x*1.7+Math.sin(y*2.3)*2)*Math.cos(y*1.3+Math.sin(x*.7)*2)}
function build(){const r=srand(seed);ps=[];for(let i=0;i<N;i++)ps.push({x:r()*cv.width,y:r()*cv.height,h:r()*360,s:.4+r()*.9});cx.fillStyle="#08090c";cx.fillRect(0,0,cv.width,cv.height);document.querySelector("#sv").textContent="seed "+seed+" · "+N+" particles"}
function step(){cx.fillStyle=`rgba(8,9,12,${TRAIL/100})`;cx.fillRect(0,0,cv.width,cv.height);for(const p of ps){const a=noise(p.x*.004,p.y*.004)*Math.PI*2;p.x+=Math.cos(a)*p.s*2;p.y+=Math.sin(a)*p.s*2;if(p.x<0)p.x+=cv.width;if(p.x>cv.width)p.x-=cv.width;if(p.y<0)p.y+=cv.height;if(p.y>cv.height)p.y-=cv.height;cx.fillStyle=`hsla(${p.h},70%,60%,.5)`;cx.fillRect(p.x,p.y,1.4,1.4)}requestAnimationFrame(step)}
document.querySelector("#prev").onclick=()=>{seed--;build()};document.querySelector("#next").onclick=()=>{seed++;build()};
document.querySelector("#rand").onclick=()=>{seed=Math.floor(Math.random()*9999);build()};
document.querySelector("#re").onclick=build;
document.querySelector("#n").oninput=e=>{N=+e.target.value;build()};
document.querySelector("#tr").oninput=e=>{TRAIL=+e.target.value};
build();step();
</script>
</body>
</html>
