<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>demo — supervisor, orbit skin</title>
<style>:root{--deep:#2b1e3e;--cos:#4a4e8f;--lav:#a490c2;--sil:#e6e6fa}*{box-sizing:border-box}body{margin:0;background:var(--deep);color:var(--sil);font-family:system-ui,sans-serif}canvas#bg{position:fixed;inset:0}main{position:relative;max-width:760px;margin:0 auto;padding:28px 20px 60px}a.back{font-family:ui-monospace,monospace;font-size:12px;color:var(--lav)}h1{font-size:32px;letter-spacing:-.02em;margin:8px 0}p.sub{color:var(--lav);font-size:13px}svg{width:100%;height:auto;display:block;margin:6px 0}.ring{transform-origin:150px 90px;animation:sp 36s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}#river{display:flex;flex-direction:column;gap:8px;margin:14px 0}.ev{background:rgba(230,230,250,.07);border:1px solid var(--lav);border-radius:16px;padding:10px 14px;font-size:14px;animation:pop .3s cubic-bezier(.34,1.4,.4,1)}@keyframes pop{from{opacity:0;transform:translateY(8px)}}.ev small{display:block;font-family:ui-monospace,monospace;font-size:10px;color:var(--lav)}#think{font-family:ui-monospace,monospace;font-size:12px;min-height:90px}#think div{margin:4px 0;color:#cfe3ff}form{display:flex;gap:8px}input{flex:1;background:rgba(230,230,250,.07);border:1px solid var(--lav);border-radius:999px;color:var(--sil);padding:12px 18px;font-size:14px;outline:none}button{background:var(--sil);color:#150f22;border:0;border-radius:999px;font-weight:800;padding:0 24px;cursor:pointer}button:disabled{opacity:.5}@media(prefers-reduced-motion:reduce){.ring,.ev{animation:none}}</style>
</head>
<body>
<canvas id="bg"></canvas>
<main>
<a class="back" href="index.html">← demos</a>
<h1>Supervisor · orbit skin</h1>
<p class="sub">skills: algorithmic-art · animate · canvas-design — starfield, revolving agents, spark bursts.</p>
<svg viewBox="0 0 300 180"><g class="ring"><circle cx="150" cy="90" r="60" fill="none" stroke="#4a4e8f"/><circle cx="150" cy="30" r="3" fill="#e6e6fa"/></g><circle cx="150" cy="90" r="15" fill="#e6e6fa"/><text x="150" y="94" text-anchor="middle" font-size="8" font-weight="bold" fill="#150f22">SUP</text><g id="sats"></g></svg>
<div id="think" aria-live="polite"></div>
<div id="river" role="log" aria-live="polite"></div>
<form id="f"><input id="q" placeholder="Transmit instruction…" autocomplete="off"/><button id="send">LAUNCH</button></form>
</main>
<script>
const LS="agent_demo_logs",BC="agent_demo_bus",$=s=>document.querySelector(s);
const REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
const AG=["researcher","coder","critic","tools"];let ang={researcher:3.5,coder:5.1,critic:.4,tools:1.9},hot=null;
function log(d,s,t,ty,p){const e={ts:new Date().toISOString(),dir:d,source:s,target:t,type:ty,payload:String(p).slice(0,2000)};try{const a=JSON.parse(localStorage.getItem(LS)||"[]");a.push(e);localStorage.setItem(LS,JSON.stringify(a.slice(-1000)))}catch{}try{new BroadcastChannel(BC).postMessage(e)}catch{}return e}
// starfield
const cv=$("#bg"),cx=cv.getContext("2d");let S=[];function init(){cv.width=innerWidth;cv.height=innerHeight;S=[];let s=7;const r=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};for(let i=0;i<160;i++)S.push({x:r()*cv.width,y:r()*cv.height,ph:r()*6.28})}addEventListener("resize",init);init();
(function loop(t){requestAnimationFrame(loop);cx.clearRect(0,0,cv.width,cv.height);S.forEach(p=>{p.ph+=.02;cx.globalAlpha=.25+.55*Math.abs(Math.sin(p.ph));cx.fillStyle="#a490c2";cx.fillRect(p.x,p.y,1.5,1.5)});cx.globalAlpha=1})(0);
function draw(){let h="";AG.forEach(id=>{const x=150+78*Math.cos(ang[id]),y=90+56*Math.sin(ang[id]),on=id===hot;h+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${on?12:9}" fill="${on?"#FF6B35":"#2b1e3e"}" stroke="#a490c2" stroke-width="1.5"/><text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="middle" font-size="6" fill="#e6e6fa">${id.slice(0,3).toUpperCase()}</text>`});$("#sats").innerHTML=h}
setInterval(()=>{if(!REDUCE)AG.forEach(id=>{if(id!==hot)ang[id]+=.01});draw()},40);
function say(who,text){const d=document.createElement("div");d.className="ev";d.innerHTML=`<small>${who}</small>`;d.appendChild(document.createTextNode(text));$("#river").appendChild(d)}
function think(t){const d=document.createElement("div");d.textContent="sup> "+t;$("#think").appendChild(d);while($("#think").children.length>6)$("#think").firstChild.remove()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(q){$("#send").disabled=true;log("IN","user","supervisor","user_message",q);say("user",q);think("planning fan-out…");await sleep(350);
for(const k of ["researcher","coder","tools","critic"]){hot=k;log("OUT","supervisor",k,"task_assign","go");say("supervisor → "+k,"dispatched");think("dispatch → "+k);await sleep(330)}
for(const k of ["researcher","coder","tools","critic"]){await sleep(280);hot=k;const r=k+" ok :: "+q.slice(0,36);log("IN",k,"supervisor","task_result",r);say(k,r);think("✓ "+k)}
hot=null;const f=`Final: merged 4 partials for "${q.slice(0,48)}" — trace on the log bus.`;log("OUT","supervisor","user","final_answer",f);say("supervisor · final",f);think("done");$("#send").disabled=false}
$("#f").addEventListener("submit",e=>{e.preventDefault();const v=$("#q").value.trim();if(!v)return;$("#q").value="";run(v)});
draw();log("INTERNAL","system","system","session_start","orbit supervisor demo loaded");
</script>
</body>
</html>
