<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>pro console — light</title>
<style>
:root{--bg:#f4f7fa;--bg2:#ffffff;--bg3:#e9eff5;--line:#d7e0e9;--line2:#b9c7d4;--tx:#16283d;--mut:#5c7186;--dim:#8fa1b1;--acc:#2f6db3;--ok:#1d7a4f;--warn:#b25e09;--mono:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:14px;display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--line)}
.brand{font-weight:800;letter-spacing:-.01em}
.crumb{font-family:var(--mono);font-size:12px;color:var(--mut)}
.live{margin-left:auto;display:flex;gap:10px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--mut)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
select,.loglink{font-family:var(--mono);font-size:11px;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 10px;color:var(--tx);text-decoration:none}
.main{flex:1;display:flex;min-height:0}
.side{width:250px;flex:0 0 250px;background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
.side h3{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--dim);margin:0;padding:14px 14px 8px}
.ag{margin:0 8px 2px;padding:8px 10px;border-radius:8px;display:flex;gap:9px;align-items:center;font-size:13px}
.ag.cur{background:var(--bg3)}
.ag .d{width:8px;height:8px;border-radius:50%;background:#c3ccd4;flex:0 0 8px}
.ag.b .d{background:var(--warn)}.ag.o .d{background:var(--ok)}
.ag small{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.foot{margin-top:auto;border-top:1px solid var(--line);padding:12px 14px;font-family:var(--mono);font-size:11px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.foot b{color:var(--tx)}
.center{flex:1;display:flex;flex-direction:column;min-width:0}
#chat{flex:1;overflow:auto;padding:22px 0}
.turn{max-width:800px;margin:0 auto;padding:0 24px 20px}
.role{font-family:var(--mono);font-size:11px;color:var(--dim);margin-bottom:7px}
.u{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;line-height:1.55}
.think{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-top:10px}
.think summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:12px;color:var(--mut);padding:10px 14px;display:flex;gap:8px}
.think summary::-webkit-details-marker{display:none}
.think .b{border-top:1px solid var(--line);padding:10px 14px;font-family:var(--mono);font-size:12px;color:var(--mut);white-space:pre-wrap;line-height:1.7}
.tool{border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin-top:8px;overflow:hidden}
.tool .h{display:flex;gap:9px;align-items:center;font-family:var(--mono);font-size:12px;padding:9px 14px;border-bottom:1px solid var(--line);color:var(--mut)}
.pill{font-size:10px;border:1px solid var(--line2);border-radius:99px;padding:2px 9px;color:var(--mut)}
.pill.r{color:var(--warn);border-color:var(--warn)}.pill.o{color:var(--ok);border-color:var(--ok)}
.dur{margin-left:auto;color:var(--dim);font-size:11px}
.tool .c{padding:9px 14px;font-family:var(--mono);font-size:12px;color:var(--mut)}
.fin{margin-top:10px;line-height:1.65}
.comp{border-top:1px solid var(--line);background:var(--bg2);padding:12px 0}
.cbox{max-width:800px;margin:0 auto;padding:0 24px}
form{display:flex;gap:8px;background:var(--bg);border:1px solid var(--line2);border-radius:12px;padding:6px 6px 6px 14px}
form:focus-within{border-color:var(--acc)}
input{flex:1;background:transparent;border:0;outline:none;font-size:14px;color:var(--tx)}
form button{background:var(--acc);color:#fff;border:0;border-radius:8px;font-weight:700;padding:10px 20px;cursor:pointer;font-size:13px}
form button:disabled{opacity:.5}
.status{flex:0 0 30px;display:flex;gap:16px;align-items:center;padding:0 16px;background:var(--bg2);border-top:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--dim)}
.status .r{margin-left:auto;display:flex;gap:16px}
#veil{position:fixed;inset:0;background:var(--bg);opacity:0;pointer-events:none;transition:opacity .3s;z-index:50}
#veil.show{opacity:1;pointer-events:all}
.empty{max-width:800px;margin:40px auto;padding:0 24px;color:var(--dim);font-size:14px}
@media(max-width:900px){.side{display:none}}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="veil"></div>
<div class="topbar"><span class="brand">Harness</span><span class="crumb">session-01 / main</span><span class="live"><span class="dot"></span><span id="evc">0 events</span><select id="th" aria-label="density"><option>comfortable</option><option>compact</option></select><a class="loglink" href="../logs.html">full log</a></span></div>
<div class="main">
<aside class="side"><h3>AGENTS</h3><div id="ags"></div><div class="foot"><span>model <b>supervisor-1.0</b></span><span>context <b id="ctx">0k / 200k</b></span><span>cost <b id="cost">$0.0000</b></span></div></aside>
<div class="center"><div id="chat"><div class="empty" id="empty">No messages yet — send the first instruction below. Every step lands in the shared log.</div></div>
<div class="comp"><div class="cbox"><form id="f"><input id="q" autocomplete="off" aria-label="message" placeholder="Message the supervisor…"/><button id="send">Run</button></form></div></div></div>
</div>
<div class="status"><span id="sb">idle</span><span class="r"><span id="tok">0 tok</span><span id="lat">— ms</span><span>bus agent_demo_logs</span></span></div>
<script>
const LS="agent_demo_logs",BC="agent_demo_bus",$=s=>document.querySelector(s);
const AG=["supervisor","researcher","coder","tools","critic"];let S={};AG.forEach(a=>S[a]="idle");
function log(d,s,t,ty,p){const e={ts:new Date().toISOString(),dir:d,source:s,target:t,type:ty,payload:String(p).slice(0,2000)};try{const a=JSON.parse(localStorage.getItem(LS)||"[]");a.push(e);localStorage.setItem(LS,JSON.stringify(a.slice(-1000)))}catch{}try{new BroadcastChannel(BC).postMessage(e)}catch{}count();return e}
let tk=0;function count(){try{const a=JSON.parse(localStorage.getItem(LS)||"[]");$("#evc").textContent=a.length+" events";tk=a.reduce((n,e)=>n+({user_message:40,thinking:120,task_assign:60,task_result:220,final_answer:180}[e.type]||50),0);$("#tok").textContent=(tk/1000).toFixed(1)+"k tok";$("#ctx").textContent=(tk/1000).toFixed(1)+"k / 200k";$("#cost").textContent="$"+(tk*0.0000032).toFixed(4)}catch{}}
function ags(){$("#ags").innerHTML=AG.map(a=>`<div class="ag ${S[a]==="idle"?"":S[a]==="done"?"o":"b cur"}"><span class="d"></span>${a}<small>${S[a]}</small></div>`).join("")}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(q){const t0=performance.now();$("#empty")?.remove();$("#send").disabled=true;$("#sb").textContent="working…";S.supervisor="busy";ags();
log("IN","user","supervisor","user_message",q);
const t=document.createElement("div");t.className="turn";t.innerHTML=`<div class="role">you</div><div class="u"></div><div class="role" style="margin-top:12px">supervisor</div><details class="think" open><summary>▸ thinking</summary><div class="b"></div></details><div class="tl"></div>`;t.querySelector(".u").textContent=q;$("#chat").appendChild(t);
const tb=t.querySelector(".think .b"),tl=t.querySelector(".tl");const th=x=>{tb.textContent+=(tb.textContent?"\n":"")+x};
th("intent parsed · scope locked");log("INTERNAL","supervisor","supervisor","thinking","parse + plan");await sleep(380);
th("plan: researcher · coder · tools · critic in parallel");
for(const [k,j] of [["researcher","read context"],["coder","draft change"],["tools","scan + fetch"],["critic","review risks"]]){S[k]="busy";ags();log("OUT","supervisor",k,"task_assign",j);const el=document.createElement("div");el.className="tool";el.innerHTML=`<div class="h"><span class="pill r">running</span><span>supervisor → ${k} · ${j}</span><span class="dur">…</span></div><div class="c">working…</div>`;tl.appendChild(el);th("dispatch → "+k);await sleep(320);const ms=260+Math.floor(Math.random()*420),out=k+" ok · "+j+" · "+q.slice(0,42);el.querySelector(".pill").className="pill o";el.querySelector(".pill").textContent="done";el.querySelector(".dur").textContent=ms+"ms";el.querySelector(".c").textContent=out;S[k]="done";ags();log("IN",k,"supervisor","task_result",out);th("← "+k+" ("+ms+"ms)")}
th("merged · 1 conflict resolved");log("INTERNAL","supervisor","supervisor","thinking","synthesize");await sleep(420);
const f=`Merged 4 results for "${q.slice(0,60)}": context in, change drafted, 2 tool signals, review signed off. Full trace in the log.`;log("OUT","supervisor","user","final_answer",f);
t.insertAdjacentHTML("beforeend",`<div class="fin"></div>`);t.lastChild.textContent=f;t.querySelector(".think").open=false;
AG.forEach(a=>S[a]="idle");ags();$("#send").disabled=false;$("#lat").textContent=Math.round(performance.now()-t0)+" ms";$("#sb").textContent="idle";$("#chat").scrollTop=1e9}
$("#f").addEventListener("submit",e=>{e.preventDefault();const v=$("#q").value.trim();if(!v)return;$("#q").value="";run(v)});
document.querySelector(".loglink").addEventListener("click",e=>{if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;e.preventDefault();const h=e.currentTarget.href;$("#veil").classList.add("show");setTimeout(()=>location.href=h,300)});
ags();count();log("INTERNAL","system","system","session_start","pro console demo loaded");
</script>
</body>
</html>
