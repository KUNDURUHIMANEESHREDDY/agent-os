<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>demo — supervisor, linear skin</title>
<style>:root{--bg:#0c0e12;--bg2:#11141a;--bg3:#171b23;--line:#232936;--tx:#e6e9ef;--mut:#8b94a5;--dim:#5b6474;--acc:#4cc38a;--warn:#e5a158;--mono:ui-monospace,Menlo,Consolas,monospace}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,sans-serif;font-size:14px}main{max-width:780px;margin:0 auto;padding:26px 20px 60px}a.back{font-family:var(--mono);font-size:12px;color:var(--mut)}h1{font-size:26px;letter-spacing:-.02em;margin:8px 0}p.sub{color:var(--mut);font-size:13px}#chat{display:flex;flex-direction:column;gap:10px;margin:18px 0}.um{background:var(--bg3);border:1px solid var(--line);border-radius:8px;padding:10px 14px;align-self:flex-end;max-width:85%}.tool{border:1px solid var(--line);border-radius:8px;background:var(--bg2);font-family:var(--mono);font-size:12px}.tool .h{display:flex;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);color:var(--mut)}.st{font-size:10px;border:1px solid var(--line);border-radius:99px;padding:1px 8px}.st.r{color:var(--warn);border-color:var(--warn)}.st.d{color:var(--acc);border-color:var(--acc)}.tool .b{padding:8px 12px;color:var(--mut)}details.think{border:1px dashed var(--line);border-radius:8px;font-family:var(--mono);font-size:12px;color:var(--mut)}details.think summary{cursor:pointer;padding:9px 12px}details.think div{padding:0 12px 10px;white-space:pre-wrap}.final{line-height:1.6;border-left:3px solid var(--acc);padding-left:12px}form{display:flex;gap:8px;margin-top:14px}input{flex:1;background:var(--bg3);border:1px solid var(--line);border-radius:8px;color:var(--tx);padding:11px 13px;font-size:14px;outline:none}button{background:var(--tx);color:var(--bg);border:0;border-radius:8px;font-weight:700;padding:0 20px;cursor:pointer}button:disabled{opacity:.5}#mini{font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:16px;max-height:150px;overflow:auto}</style>
</head>
<body>
<main>
<a class="back" href="index.html">← demos</a>
<h1>Supervisor · linear skin</h1>
<p class="sub">skills: ui-ux-pro-max · shadcn · design-taste-frontend — tool rows, collapsible thinking, shared log bus.</p>
<div id="chat"></div>
<form id="f"><input id="q" placeholder="Message the supervisor…" autocomplete="off"/><button id="send">Run</button></form>
<div id="mini"></div>
</main>
<script>
const LS="agent_demo_logs",BC="agent_demo_bus",$=s=>document.querySelector(s);
function log(d,s,t,ty,p){const e={ts:new Date().toISOString(),dir:d,source:s,target:t,type:ty,payload:String(p).slice(0,2000)};try{const a=JSON.parse(localStorage.getItem(LS)||"[]");a.push(e);localStorage.setItem(LS,JSON.stringify(a.slice(-1000)))}catch{}try{new BroadcastChannel(BC).postMessage(e)}catch{}mini(e);return e}
function mini(e){const d=document.createElement("div");d.textContent=`${e.ts.slice(11,19)} ${e.dir} ${e.source}→${e.target} [${e.type}]`;$("#mini").prepend(d);while($("#mini").children.length>20)$("#mini").lastChild.remove()}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function run(q){$("#send").disabled=true;log("IN","user","supervisor","user_message",q);$("#chat").insertAdjacentHTML("beforeend",`<div class="um"></div>`);$("#chat").lastChild.textContent=q;
const box=document.createElement("div");box.innerHTML=`<details class="think" open><summary>supervisor thinking</summary><div></div></details><div class="t"></div>`;$("#chat").appendChild(box);const tb=box.querySelector(".think div"),tw=box.querySelector(".t");
const th=t=>{tb.textContent+=(tb.textContent?"\n":"")+t;log("INTERNAL","supervisor","supervisor","thinking",t)};
th("intent parsed · planning fan-out");await sleep(350);
const jobs={researcher:"read context",coder:"draft change",tools:"scan + fetch",critic:"review risks"};
for(const k of Object.keys(jobs)){log("OUT","supervisor",k,"task_assign",jobs[k]);const el=document.createElement("div");el.className="tool";el.innerHTML=`<div class="h"><span class="st r">running</span><span>supervisor → ${k} · ${jobs[k]}</span></div><div class="b">…</div>`;tw.appendChild(el);th("dispatch → "+k);await sleep(320);const out=k+" ok · "+q.slice(0,40);el.querySelector(".st").className="st d";el.querySelector(".st").textContent="done";el.querySelector(".b").textContent=out;log("IN",k,"supervisor","task_result",out);th("← "+k+" returned")}
th("merged · conflict resolved");await sleep(350);
const f=`Done: split "${q.slice(0,50)}" across researcher/coder/tools/critic and merged. See main log page for the full trace.`;log("OUT","supervisor","user","final_answer",f);
box.insertAdjacentHTML("beforeend",`<div class="final"></div>`);box.lastChild.textContent=f;box.querySelector(".think").open=false;$("#send").disabled=false}
$("#f").addEventListener("submit",e=>{e.preventDefault();const v=$("#q").value.trim();if(!v)return;$("#q").value="";run(v)});
log("INTERNAL","system","system","session_start","linear supervisor demo loaded");
</script>
</body>
</html>
