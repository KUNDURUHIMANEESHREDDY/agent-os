<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TeamForge — Team Availability & Matcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f8fafc; --surface: #ffffff; --surface-2: #f1f5f9; --border: #e2e8f0;
  --text: #0f172a; --muted: #64748b; --blue: #2563eb; --blue-soft: #eff6ff;
  --green: #10b981; --green-soft: #ecfdf5; --red: #ef4444; --red-soft: #fef2f2;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17; --surface: #131b26; --surface-2: #1b2533; --border: #233144;
    --text: #f1f5f9; --muted: #94a3b8; --blue: #3b82f6; --blue-soft: #142845;
    --green: #10b981; --green-soft: #0e3022; --red: #f87171; --red-soft: #381a1a;
  }
}
* { box-sizing: border-box; }
body {
  font-family: Inter, system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  margin: 0; padding: 18px 24px; min-height: 100vh; width: 100%;
}
.app-container { width: 100%; max-width: 100%; margin: 0; }
header {
  display: flex; justify-content: space-between; align-items: center;
  flex-wrap: wrap; gap: 12px; margin-bottom: 24px; padding-bottom: 16px;
  border-bottom: 1px solid var(--border);
}
.brand { display: flex; align-items: center; gap: 10px; }
.logo {
  width: 36px; height: 36px; border-radius: 9px;
  background: linear-gradient(135deg, var(--blue) 0%, #1d4ed8 100%);
  color: #fff; font-weight: 700; font-size: 18px;
  display: grid; place-items: center;
}
h1 { font-size: 20px; font-weight: 700; margin: 0; }
p.sub { font-size: 12px; color: var(--muted); margin: 3px 0 0; }
.stat-pills { display: flex; gap: 8px; }
.stat-pill {
  padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600;
  border: 1px solid var(--border); background: var(--surface);
}
.stat-pill.free { color: var(--green); background: var(--green-soft); border-color: rgba(16,185,129,.3); }

.grid-layout { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
@media (max-width: 840px) { .grid-layout { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; box-shadow: 0 1px 3px rgba(0,0,0,.03);
}
.card-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px;
}
.card-title { font-size: 14px; font-weight: 700; }

.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
input, select, button {
  font: inherit; font-size: 12px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 7px 11px; outline: 0;
}
input:focus, select:focus { border-color: var(--blue); }
button.primary {
  background: var(--blue); color: #fff; border-color: var(--blue);
  font-weight: 600; cursor: pointer; transition: all .15s;
}
button.primary:hover { opacity: .9; }
button.primary:disabled { opacity: .5; cursor: not-allowed; }
button.ghost { cursor: pointer; }
button.ghost:hover { background: var(--surface-2); }

.member-list, .team-list { display: flex; flex-direction: column; gap: 8px; }
.member-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 10px 12px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; transition: border-color .15s;
}
.member-item:hover { border-color: var(--blue); }
.member-info { display: flex; align-items: center; gap: 10px; }
.avatar {
  width: 32px; height: 32px; border-radius: 50%; background: var(--blue-soft);
  color: var(--blue); font-weight: 700; font-size: 12px;
  display: grid; place-items: center; border: 1px solid var(--border);
}
.member-name { font-size: 12.5px; font-weight: 600; }
.member-role { font-size: 10px; color: var(--muted); }
.status-badge {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  padding: 2px 7px; border-radius: 20px;
}
.status-badge.free { color: var(--green); background: var(--green-soft); border: 1px solid rgba(16,185,129,.3); }
.status-badge.busy { color: var(--red); background: var(--red-soft); border: 1px solid rgba(239,68,68,.3); }

.team-card {
  padding: 12px; background: var(--surface-2); border: 1px solid var(--border);
  border-radius: 9px; margin-bottom: 8px;
}
.team-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.team-title { font-size: 13px; font-weight: 700; color: var(--blue); }
.team-members { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.member-chip {
  font-size: 10.5px; padding: 2px 8px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 20px; font-weight: 500;
}
.empty-text { font-size: 11.5px; color: var(--muted); text-align: center; padding: 24px 0; }
</style>
</head>
<body>
<div class="app-container">
  <header>
    <div class="brand">
      <div class="logo">TF</div>
      <div>
        <h1>TeamForge</h1>
        <p class="sub">Find who is free and assemble teams instantly</p>
      </div>
    </div>
    <div class="stat-pills">
      <div class="stat-pill free"><span id="freeCount">0</span> Available</div>
      <div class="stat-pill"><span id="totalCount">0</span> Total Members</div>
      <div class="stat-pill"><span id="teamCount">0</span> Active Teams</div>
    </div>
  </header>

  <div class="grid-layout">
    <!-- Members Column -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Teammates &amp; Availability</div>
        <div style="display:flex;gap:5px">
          <button type="button" class="ghost filter-btn active" data-filter="all">All</button>
          <button type="button" class="ghost filter-btn" data-filter="free">Free only</button>
        </div>
      </div>

      <!-- Add member row -->
      <div class="toolbar">
        <input id="newMemberName" placeholder="Name (e.g. Alex Chen)" style="flex:1" />
        <input id="newMemberRole" placeholder="Role (e.g. Frontend)" style="width:140px" />
        <button type="button" id="btnAddMember" class="primary">+ Add</button>
      </div>

      <div class="member-list" id="memberList"></div>
    </div>

    <!-- Team Formation Column -->
    <div class="card">
      <div class="card-head">
        <div class="card-title">Form New Team</div>
      </div>
      <p style="font-size:11px;color:var(--muted);margin:0 0 12px">Select available members on the left to combine them into a squad.</p>
      
      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <input id="newTeamName" placeholder="Project / Team Name (e.g. Mobile Redesign)" />
        <button type="button" id="btnFormTeam" class="primary" disabled>Assemble Team from Selected</button>
      </div>

      <div class="card-head" style="margin-top:20px;border-top:1px solid var(--border);padding-top:14px">
        <div class="card-title">Active Formed Teams</div>
      </div>
      <div class="team-list" id="teamList"></div>
    </div>
  </div>
</div>

<script>
let state = {
  members: [
    { id: "m1", name: "Sarah Connor", role: "AI Engineer", status: "free", selected: false },
    { id: "m2", name: "David Miller", role: "Fullstack Developer", status: "free", selected: false },
    { id: "m3", name: "Elena Rostova", role: "UI/UX Designer", status: "busy", selected: false },
    { id: "m4", name: "Marcus Wright", role: "DevOps Specialist", status: "free", selected: false },
    { id: "m5", name: "Priya Sharma", role: "Backend Architect", status: "busy", selected: false }
  ],
  teams: [
    { id: "t1", name: "Alpha Core Team", members: ["Sarah Connor", "Marcus Wright"] }
  ],
  filter: "all"
};

// Load saved data if present
try {
  const saved = localStorage.getItem("teamforge_state");
  if (saved) state = JSON.parse(saved);
} catch {}

function save() {
  try { localStorage.setItem("teamforge_state", JSON.stringify(state)); } catch {}
}

const $ = (s) => document.querySelector(s);
const $$ = (s) => [...document.querySelectorAll(s)];

function render() {
  const freeMembers = state.members.filter(m => m.status === "free");
  $("#freeCount").textContent = freeMembers.length;
  $("#totalCount").textContent = state.members.length;
  $("#teamCount").textContent = state.teams.length;

  // Selected free count
  const selectedFree = state.members.filter(m => m.selected && m.status === "free");
  const teamNameInput = $("#newTeamName");
  const btnForm = $("#btnFormTeam");
  btnForm.disabled = selectedFree.length < 1 || !teamNameInput.value.trim();
  btnForm.textContent = selectedFree.length > 0 
    ? `Assemble Team (${selectedFree.length} selected)` 
    : "Select free members to form team";

  // Filter members
  const visible = state.filter === "free" ? freeMembers : state.members;
  const list = $("#memberList");
  if (visible.length === 0) {
    list.innerHTML = `<div class="empty-text">No teammates match current filter.</div>`;
  } else {
    list.innerHTML = visible.map(m => {
      const isFree = m.status === "free";
      return `
        <div class="member-item">
          <div class="member-info">
            <input type="checkbox" ${isFree ? "" : "disabled"} ${m.selected && isFree ? "checked" : ""} data-selectid="${m.id}" title="${isFree ? "Select for team" : "Busy members cannot be assigned"}" style="cursor:${isFree ? "pointer" : "not-allowed"}" />
            <div class="avatar">${m.name.split(" ").map(n => n[0]).join("").slice(0, 2)}</div>
            <div>
              <div class="member-name">${m.name}</div>
              <div class="member-role">${m.role}</div>
            </div>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <span class="status-badge ${m.status}">${m.status}</span>
            <button type="button" class="ghost" data-toggleid="${m.id}" style="font-size:11px;padding:3px 8px">
              ${isFree ? "Set Busy" : "Set Free"}
            </button>
            <button type="button" class="ghost" data-delid="${m.id}" style="color:var(--red);padding:3px 7px" title="Delete">✕</button>
          </div>
        </div>`;
    }).join("");
  }

  // Render Teams
  const tList = $("#teamList");
  if (state.teams.length === 0) {
    tList.innerHTML = `<div class="empty-text">No teams formed yet.</div>`;
  } else {
    tList.innerHTML = state.teams.map(t => `
      <div class="team-card">
        <div class="team-header">
          <span class="team-title">${t.name}</span>
          <button type="button" class="ghost" data-delteam="${t.id}" style="color:var(--red);padding:2px 6px;font-size:10px">Disband</button>
        </div>
        <div class="team-members">
          ${t.members.map(name => `<span class="member-chip">${name}</span>`).join("")}
        </div>
      </div>
    `).join("");
  }
}

// Event bindings
$("#memberList").onclick = (e) => {
  const t = e.target;
  if (t.dataset.toggleid) {
    const m = state.members.find(x => x.id === t.dataset.toggleid);
    if (m) {
      m.status = m.status === "free" ? "busy" : "free";
      if (m.status === "busy") m.selected = false;
      save(); render();
    }
  } else if (t.dataset.delid) {
    state.members = state.members.filter(x => x.id !== t.dataset.delid);
    save(); render();
  }
};

$("#memberList").onchange = (e) => {
  if (e.target.dataset.selectid) {
    const m = state.members.find(x => x.id === e.target.dataset.selectid);
    if (m) {
      m.selected = e.target.checked;
      render();
    }
  }
};

$("#teamList").onclick = (e) => {
  if (e.target.dataset.delteam) {
    state.teams = state.teams.filter(t => t.id !== e.target.dataset.delteam);
    save(); render();
  }
};

$("#btnAddMember").onclick = () => {
  const name = $("#newMemberName").value.trim();
  const role = $("#newMemberRole").value.trim() || "Contributor";
  if (!name) return alert("Please enter teammate name");
  state.members.push({
    id: "m" + Date.now().toString(36),
    name, role, status: "free", selected: false
  });
  $("#newMemberName").value = "";
  $("#newMemberRole").value = "";
  save(); render();
};

$("#newTeamName").oninput = render;

$("#btnFormTeam").onclick = () => {
  const name = $("#newTeamName").value.trim();
  const selected = state.members.filter(m => m.selected && m.status === "free");
  if (!name || selected.length === 0) return;
  state.teams.push({
    id: "t" + Date.now().toString(36),
    name,
    members: selected.map(m => m.name)
  });
  // Mark chosen members as busy
  selected.forEach(m => { m.status = "busy"; m.selected = false; });
  $("#newTeamName").value = "";
  save(); render();
};

$$(".filter-btn").forEach(b => {
  b.onclick = () => {
    $$(".filter-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    state.filter = b.dataset.filter;
    render();
  };
});

render();
</script>
</body>
</html>
